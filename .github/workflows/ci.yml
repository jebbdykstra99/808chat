name: ci
# Thin caller of the shared static-room check in subx-factory.
# Pinned to a factory SHA, not @main. No secrets. No paid services.
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  check:
    uses: jebbdykstra99/subx-factory/.github/workflows/room-static-check.yml@7951a03247f73e259d50854b4f0f099af30655d8
    with:
      expect_indexable: true
      fail_on_stale: false
      factory_ref: 7951a03247f73e259d50854b4f0f099af30655d8
