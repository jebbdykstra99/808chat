name: ci
# Thin caller of the shared static-room check in subx-factory.
# Pinned to a factory SHA, not @main. No secrets. No paid services.
on:
  pull_request:
  push:
    branches: [main]
permissions: { contents: read }
jobs:
  check:
    uses: jebbdykstra99/subx-factory/.github/workflows/room-static-check.yml@07e5451359805e6b53bdeb081cc6cadfd1e5bc57
    with:
      expect_indexable: true
      fail_on_stale: false
